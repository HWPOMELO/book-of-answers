<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>极致写实 · 答案之书</title>
    <style>
        /* 铺设桌面背景 */
        body {
            margin: 0;
            padding: 0;
            background: #e2e7ec;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvi;
            font-family: "Georgia", "Source Han Serif SC", "SimSun", serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. 外层精装硬皮书壳 */
        .book-cover {
            position: relative;
            width: 1000px;
            height: 640px;
            background: #1e2d3d;
            /* 典雅深藏青 */
            padding: 14px 16px 16px 14px;
            border-radius: 6px;
            box-sizing: border-box;
            box-shadow:
                0 30px 70px rgba(10, 20, 30, 0.3),
                0 10px 20px rgba(0, 0, 0, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 1px 0 0 rgba(255, 255, 255, 0.1),
                inset 0 -3px 6px rgba(0, 0, 0, 0.4);
        }

        /* 2. 密集纸堆厚度效果 */
        .book-pages-stack {
            width: 100%;
            height: 100%;
            background-color: #dcdcd4;
            position: relative;
            border-radius: 3px;
            box-shadow:
                -1px 1px 0px #d4d4cb, -2px 2px 0px #c9c9c0, -3px 3px 1px #bfbfb4, -4px 4px 1px #b5b5aa, -5px 5px 2px #aaaa9f, -6px 6px 3px rgba(0, 0, 0, 0.15),
                1px 1px 0px #d4d4cb, 2px 2px 0px #c9c9c0, 3px 3px 1px #bfbfb4, 4px 4px 1px #b5b5aa, 5px 5px 2px #aaaa9f, 6px 6px 3px rgba(0, 0, 0, 0.15);
        }

        /* 主页面核心板 */
        .book-core {
            display: flex;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        /* 3. 页面基础样式与高级纸感肌理 */
        .page {
            flex: 1;
            height: 100%;
            box-sizing: border-box;
            padding: 65px 70px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 左页：纸纹 + 边缘暗化 + 靠近中缝的自然下凹阴影 */
        .page-left {
            border-radius: 3px 0 0 3px;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.01) 50%, rgba(255, 255, 255, 0.01) 50%),
                radial-gradient(circle at 0% 50%, transparent 60%, rgba(0, 0, 0, 0.03) 100%),
                linear-gradient(to right, #fffdfa 0%, #fbf9f4 60%, #f3f0e7 80%, #e3dfd2 93%, #c0bbb0 100%);
            background-size: 3px 100%, 100% 100%, 100% 100%;
            box-shadow: inset 3px 0 5px rgba(0, 0, 0, 0.02), inset 0 3px 3px rgba(0, 0, 0, 0.02), inset 0 -3px 3px rgba(0, 0, 0, 0.02);
        }

        /* 右页：与左页镜像，取消了中间多余的死黑缝隙，改用平滑光影交接 */
        .page-right {
            border-radius: 0 3px 3px 0;
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.01) 50%, rgba(255, 255, 255, 0.01) 50%),
                radial-gradient(circle at 100% 50%, transparent 60%, rgba(0, 0, 0, 0.03) 100%),
                linear-gradient(to left, #fffdfa 0%, #fbf9f4 60%, #f3f0e7 80%, #e3dfd2 93%, #c0bbb0 100%);
            background-size: 3px 100%, 100% 100%, 100% 100%;
            box-shadow: inset -3px 0 5px rgba(0, 0, 0, 0.02), inset 0 3px 3px rgba(0, 0, 0, 0.02), inset 0 -3px 3px rgba(0, 0, 0, 0.02);
        }

        /* 左右两边的装订物理压线 */
        .page-left::after {
            content: "";
            position: absolute;
            top: 0;
            right: 18px;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.01) 50%, rgba(0, 0, 0, 0.04));
        }

        .page-right::after {
            content: "";
            position: absolute;
            top: 0;
            left: 18px;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.01) 50%, rgba(0, 0, 0, 0.04));
        }

        /* 4. 完美居中的丝带书签 */
        .bookmark-ribbon {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            /* 严格水平居中 */
            width: 18px;
            height: 105%;
            background: #8b1e20;
            z-index: 12;
            border-radius: 1px 1px 0 0;
            background-image: linear-gradient(90deg, #701618 0%, #8b1e20 30%, #a62b2e 60%, #701618 100%);
            filter: drop-shadow(0px 4px 5px rgba(0, 0, 0, 0.3));
            /* 居中后投影自然向下散开 */
            border-bottom-right-radius: 3px;
        }

        /* 5. 页面排版元系统 */
        .page-header {
            font-size: 11px;
            color: #858276;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            border-bottom: 1px solid rgba(140, 133, 110, 0.15);
            padding-bottom: 10px;
        }

        .page-left .page-header {
            text-align: left;
        }

        .page-right .page-header {
            text-align: right;
        }

        .page-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-top: 35px;
        }

        .page-footer {
            font-size: 11px;
            color: #949082;
        }

        .page-left .page-footer {
            text-align: left;
        }

        .page-right .page-footer {
            text-align: right;
        }

        /* 6. 左页：答案之书特有元素 */
        .book-title {
            font-size: 28px;
            color: #1a1a1a;
            margin: 0 0 15px 0;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .book-intro {
            font-size: 14px;
            color: #55524a;
            line-height: 1.8;
            text-align: justify;
            margin-bottom: 40px;
        }

        /* 写实素雅的交互输入框 */
        .input-container {
            margin-top: auto;
            /* 推至底部 */
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 13px;
            color: #7c786c;
            margin-bottom: 8px;
            display: block;
        }

        .question-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(140, 133, 110, 0.3);
            border-radius: 4px;
            font-family: inherit;
            font-size: 14.5px;
            color: #2b2b28;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
            outline: none;
            transition: border-color 0.3s;
        }

        .question-input:focus {
            border-color: #8b1e20;
            /* 聚焦时变为书签红，增加精致感 */
        }

        /* 7. 右页：问题与答案展示区（文字渐变出现） */
        .display-section {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 上方：用户问题区 */
        .user-question-box {
            min-height: 80px;
            border-bottom: 1px dashed rgba(140, 133, 110, 0.25);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .question-tag {
            font-size: 12px;
            color: #9e2a2b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        /* 下方：神圣答案区 */
        .answer-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* 答案在下半部分居中展示 */
            align-items: center;
            padding-bottom: 40px;
        }

        .answer-tag {
            font-size: 12px;
            color: #7c786c;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        /* 8. 核心需求：文字渐变淡入动画（由透明 + 位移 优雅滑入） */
        .fade-in-text {
            font-size: 16px;
            color: #333330;
            line-height: 1.6;
            font-style: italic;

            /* 触发渐变显现的动画配置 */
            opacity: 0;
            transform: translateY(6px);
            animation: elegantFadeIn 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .fade-in-answer {
            font-size: 32px;
            /* 答案字号放大，更有仪式感 */
            color: #1a1a1a;
            font-weight: 500;
            letter-spacing: 2px;
            text-align: center;

            /* 稍作延迟显现，先出问题，后出答案 */
            opacity: 0;
            transform: translateY(10px);
            animation: elegantFadeIn 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.8s;
        }

        /* 渐变显现动画帧 */
        @keyframes elegantFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="book-cover">
        <div class="book-pages-stack">

            <div class="bookmark-ribbon"></div>

            <div class="book-core">

                <div class="page page-left">
                    <div class="page-header">THE BOOK OF ANSWERS</div>

                    <div class="page-body">
                        <h1 class="book-title">答案之书</h1>
                        <p class="book-intro">
                            这是一本关于释怀与指引的媒介。当你心中饱含困惑、犹豫不决或者企图寻找某种共鸣时，请在心中默念你的问题五秒钟，并在下方亲手镌刻下它。
                        </p>
                        <p class="book-intro" style="font-size: 13px; color: #858276;">
                            注意：请闭上双眼，问出那些真正困扰你、且能够用“是”或“否”来回答的具象问题。转动钥匙，答案即在彼岸。
                        </p>

                        <div class="input-container">
                            <label class="input-label" for="q">将你的困惑写在纸上...</label>
                            <input type="text" id="q" class="question-input" placeholder="例如：我该坚持现在选择的方向吗？"
                                autocomplete="off">
                        </div>
                    </div>

                    <div class="page-footer">扉页 · 启</div>
                </div>

                <div class="page page-right">
                    <div class="page-header">THE REVELATION</div>

                    <div class="page-body">
                        <div class="display-section">

                            <div class="user-question-box">
                                <div class="question-tag">心中所问 / THE QUESTION</div>
                                <div class="fade-in-text">“ 我该坚持现在选择的方向吗？ ”</div>
                            </div>

                            <div class="answer-box">
                                <div class="answer-tag">诠释</div>
                                <div class="fade-in-answer">顺从你的直觉。</div>
                            </div>

                        </div>
                    </div>

                    <div class="page-footer">正文 · 01</div>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
